name: Build ZAKTECH ERP (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'application (.exe)
        run: npm run dist

      - name: Mettre le .exe à disposition au téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: ZAKTECH-ERP-Windows
          path: dist/*.exe
